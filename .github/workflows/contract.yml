# job-מראה לבדיקת חוזה טבלאות ה-patch מול צד ה-Dart (Otzaria/otzaria_library_updater).
# המאגר ציבורי כרגע ולכן אין צורך ב-token; אם יהפוך לפרטי יש להוסיף
# ל-checkout שלו `token: ${{ secrets.CONTRACT_REPO_TOKEN }}` ולהגדיר את ה-secret.
name: contract

on:
  push:
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    env:
      KOTLIN_FIXTURE: generator/common/src/jvmTest/resources/patch_tables_contract.json
      DART_FIXTURE: seforim-library-updater/test/patch_tables_contract.json
      KOTLIN_HASH_FIXTURE: generator/common/src/jvmTest/resources/logical_hash_contract.json
      DART_HASH_FIXTURE: seforim-library-updater/test/logical_hash_contract.json
      KOTLIN_VISIBILITY_FIXTURE: generator/sefariasqlite/src/jvmTest/resources/link_visibility_contract_v1.json
      SEFARIA_VISIBILITY_FIXTURE: sefaria-export/link_visibility_contract_v1.json
    steps:
      - uses: actions/checkout@v4

      # A coordinated contract change spans two repositories. On a PR, prefer
      # a linked open companion PR by the same author; on push (or when none is
      # linked) keep validating against the companion's default branch.
      - name: Resolve linked updater PR
        id: updater
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo=Otzaria/otzaria_library_updater
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            marker="$GITHUB_REPOSITORY#${{ github.event.pull_request.number }}"
            author='${{ github.event.pull_request.user.login }}'
            number=$(gh api -X GET search/issues \
              -f q="repo:$repo is:pr is:open author:$author \"$marker\"" \
              --jq '.items[0].number // empty')
            if [ -n "$number" ]; then
              companion_repo=$(gh api "repos/$repo/pulls/$number" --jq .head.repo.full_name)
              companion_ref=$(gh api "repos/$repo/pulls/$number" --jq .head.ref)
              echo "repository=$companion_repo" >> "$GITHUB_OUTPUT"
              echo "ref=$companion_ref" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "repository=$repo" >> "$GITHUB_OUTPUT"
          echo "ref=main" >> "$GITHUB_OUTPUT"

      - name: Checkout Otzaria/otzaria_library_updater (צד ה-Dart)
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.updater.outputs.repository }}
          ref: ${{ steps.updater.outputs.ref }}
          path: seforim-library-updater

      - name: Checkout Otzaria/SefariaExport visibility contract
        uses: actions/checkout@v4
        with:
          repository: Otzaria/SefariaExport
          path: sefaria-export

      # נתיב שגוי חייב להיכשל בקול רם, לא להתדלג בשקט
      - name: Verify both fixtures exist
        run: |
          test -f "$KOTLIN_FIXTURE"
          test -f "$DART_FIXTURE"
          test -f "$KOTLIN_HASH_FIXTURE"
          test -f "$DART_HASH_FIXTURE"
          test -f "$KOTLIN_VISIBILITY_FIXTURE"
          test -f "$SEFARIA_VISIBILITY_FIXTURE"

      # השוואת בתים ישירה בין שני ה-fixtures — הבדיקה המקבילה בצד ה-Dart רצה ב-CI של ה-updater
      - name: cmp fixtures (byte-identical)
        run: |
          cmp "$KOTLIN_FIXTURE" "$DART_FIXTURE"
          cmp "$KOTLIN_HASH_FIXTURE" "$DART_HASH_FIXTURE"
          cmp "$KOTLIN_VISIBILITY_FIXTURE" "$SEFARIA_VISIBILITY_FIXTURE"

      # cmp לבדו תופס רק סטייה בין שני ה-fixtures. שינוי ברשימת הטבלאות בצד Kotlin
      # שכן מתעדכן ב-fixture ה-Kotlini היה עובר בשקט — לכן מריצים גם את בדיקת החוזה
      # הקוטלינית עצמה (מאמתת את הרשימה מול הקוד), כדי שתיכשל ב-push. JDK 25 כמו ci.yml;
      # setup-gradle מספק caching (כמו gradle-build-action ב-ci.yml).
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Kotlin patch-tables contract test
        run: ./gradlew :generator-common:jvmTest --tests '*PatchTablesContractTest*' --tests '*LogicalHashContractTest*' --no-daemon
